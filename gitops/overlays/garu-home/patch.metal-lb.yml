---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metal-lb
  namespace: kube-system
spec:
  values:
    prometheus:
      # Create ServiceMonitors for the Prometheus Operator
      serviceMonitor:
        enabled: true
      # The chart requires prometheus.serviceAccount and prometheus.namespace when
      # rbacPrometheus is true and a ServiceMonitor/PodMonitor is enabled. No
      # Prometheus Operator is deployed in this repo yet, so namespace-scoped RBAC
      # is disabled. Once an operator exists, set rbacPrometheus back to true and
      # provide serviceAccount + namespace (and drop this comment).
      rbacPrometheus: false

    controller:
      resources:
        limits:
          memory: 100Mi
        requests:
          memory: 25Mi
          cpu: 25m

    speaker:
      resources:
        limits:
          memory: 100Mi
        requests:
          memory: 25Mi
          cpu: 25m
