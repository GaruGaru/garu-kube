---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dydns
  namespace: dydns
spec:
  selector:
    matchLabels:
      app: dydns

  template:
    metadata:
      labels:
        app: dydns

    spec:
      containers:
        - name: dydns
          image: garugaru/dydns:bb597c5ca522aeb0a88fa5e852507eb1f5897335
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: dydns
          resources:
            requests:
              memory: "30Mi"
              cpu: "50m"
            limits:
              memory: "30Mi"
              cpu: "50m"
