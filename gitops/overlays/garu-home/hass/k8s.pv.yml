apiVersion: v1
kind: PersistentVolume
metadata:
  name: hass-config
  namespace: hass
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  iscsi:
    targetPortal: 192.168.1.5:3260
    iqn: iqn.2026-01.local.nas:k8s-hass-config
    lun: 0
    fsType: ext4
    readOnly: false
