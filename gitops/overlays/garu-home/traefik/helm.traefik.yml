---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 5m
  chart:
    spec:
      # renovate: registryUrl=https://traefik.github.io/charts
      chart: traefik
      version: 41.6.1
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 10m
  test:
    enable: false # Enable helm test
  install:
    remediation: # perform remediation when helm install fails
      retries: 3
  upgrade:
    remediation: # perform remediation when helm upgrade fails
      retries: 3
      remediateLastFailure: true # remediate the last failure, when no retries remain
    cleanupOnFail: true
  rollback:
    timeout: 10m
    recreate: true
    cleanupOnFail: true
  values:
    providers:
      kubernetesCRD:
        enabled: true
      kubernetesIngress:
        enabled: false
      kubernetesGateway:
        enabled: true

    deployment:
      enabled: true
      kind: DaemonSet

    service:
      enabled: true
      # Single service is using `MixedProtocolLBService` feature gate.
      # When set to false, it will create two Service, one for TCP and one for UDP.
      single: true
      spec:
        type: LoadBalancer

    gateway:
      enabled: true
      name: "garu-me"
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      listeners:
        web:
          port: 8000
          protocol: HTTP
          namespacePolicy:
            from: All
        websecure:
          port: 8443
          protocol: HTTPS
          mode: Terminate
          namespacePolicy:
            from: All
          certificateRefs:
            - name: garu-me-tls
